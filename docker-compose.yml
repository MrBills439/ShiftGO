version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiftgo
      POSTGRES_PASSWORD: shiftgo_pass
      POSTGRES_DB: shiftgo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiftgo']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://shiftgo:shiftgo_pass@postgres:5432/shiftgo
      REDIS_URL: redis://redis:6379

volumes:
  postgres_data:
  redis_data:
